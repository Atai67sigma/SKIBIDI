<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website</title>
</head>
<body>

<audio id="audio" autoplay loop>
    <source src="scream55.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio");
audio.volume = 1;

audio.play().catch(() => {
    document.addEventListener("click", () => {
        audio.play();
    }, { once: true });
});
</script>

</body>
</html>
